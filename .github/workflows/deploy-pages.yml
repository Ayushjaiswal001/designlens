name: Deploy DesignLens to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          DESIGNLENS_API_BASE: ${{ vars.DESIGNLENS_API_BASE }}
        run: |
          mkdir -p _site
          cp -R public/. _site/
          node <<'NODE'
          const fs = require('node:fs');
          const apiBase = (process.env.DESIGNLENS_API_BASE || '').trim().replace(/\/+$/, '');
          fs.writeFileSync('_site/config.js', `window.DESIGNLENS_API_BASE = ${JSON.stringify(apiBase)};\n`);
          NODE
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
