name: Deploy DesignLens to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api-base:
        description: API base URL for this deployment
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          DESIGNLENS_API_BASE: ${{ inputs['api-base'] || vars.DESIGNLENS_API_BASE }}
        run: |
          mkdir -p _site
          cp -R public/. _site/
          node <<'NODE'
          const fs = require('node:fs');
          const apiBase = (process.env.DESIGNLENS_API_BASE || '').trim().replace(/\/+$/, '');
          fs.writeFileSync('_site/config.js', `window.DESIGNLENS_API_BASE = ${JSON.stringify(apiBase)};\n`);
          NODE
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for Pages artifact registration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..10}; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | grep -q .; then
              echo "Pages artifact is available."
              exit 0
            fi
            sleep 2
          done
          echo "Pages artifact did not become available." >&2
          exit 1
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
